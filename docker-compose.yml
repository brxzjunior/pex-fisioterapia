version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fisiopro-postgres
    restart: always
    environment:
      POSTGRES_USER: fisiopro
      POSTGRES_PASSWORD: fisiopro_secret_password
      POSTGRES_DB: fisiopro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisiopro -d fisiopro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fisiopro-backend
    restart: always
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://fisiopro:fisiopro_secret_password@postgres:5432/fisiopro_db?schema=public
      SESSION_SECRET: ultra_secure_fisiopro_production_jwt_secret_key_change_me
      FRONTEND_URL: http://localhost:80
      ALLOWED_ADMIN_EMAIL: dra.leticia@fisiopro.com.br
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: "contato@fisiopro.com.br"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3333/api
    container_name: fisiopro-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

